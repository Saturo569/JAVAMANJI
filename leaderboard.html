<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Game Monitor</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Forta', sans-serif;
            background-image: url(bgg.gif);
            background-repeat: no-repeat;
            background-size: 100%;
            background-position: 10%;
        }

        h1, h2 {
            text-align: center;
            color: black;
           
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .section {
            background-color: #4fc3f7;
            border-radius: 8px;
            padding: 20px;
            width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
        }

        .section h3 {
            text-align: center;
            color: #121212;
        }

        .table-container {
            max-height: 300px;
            overflow-y: auto;
          
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #000;
            text-align: center;
            text-transform: none;
        }

        th {
            background-color: #2e86c1;
        }

        .clear-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 1rem;
        }

        .clear-btn:hover {
            background-color: darkred;
        }

       img{
        color: aliceblue;
       }

         .back a{
            color: black;
            text-decoration: none;
            margin-left: 3rem;
            background-color:#86c1de;;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 1rem;
            box-shadow:
            inset -6px 4px 1px grey,
            inset -6px -4px 1px 1px gray,
            inset 2px 0px 1px 1px lightgray;
         }
        
         .back a:hover{
          color: aliceblue;
         }
        

       
    </style>
</head>
<body>
    <audio id="background-music" autoplay loop>
        <source src="bgm.mp3">
    </audio>
   
    <a href="home.html"><img src="logo.png" ></a>
    <h1>Leaderboards</h1>

    <div class="container">
        <!-- Leaderboard Section -->
        <div class="section">
            <h3>Leaderboard</h3>
            <div class="table-container">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player Name</th>
                            <th>Grade/Section</th> <!-- New Column Added -->
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

        </div>

    <div class="back">
        <a href="home.html" ><i class="fa-solid fa-house"></i> Home</a>
    </div>
   
    <script src="leaderboard.js"></script>
    <script src="indexeddb.js"></script>
    <script>
       function displayAdminLeaderboard() {
            const dbRequest = indexedDB.open("LeaderboardDB", 1);

            dbRequest.onsuccess = (event) => {
                const db = event.target.result;
                const transaction = db.transaction("scores", "readonly");
                const objectStore = transaction.objectStore("scores");

                const getAllRequest = objectStore.getAll();

                getAllRequest.onsuccess = (e) => {
                    const scores = e.target.result;
                    const leaderboardTable = document.getElementById('leaderboard-table').querySelector('tbody');

                    leaderboardTable.innerHTML = "";
                    scores.sort((a, b) => b.score - a.score);

                    scores.forEach((entry, index) => {
                        const row = `<tr>
                            <td>${index + 1}</td>
                            <td>${entry.playerName}</td>
                            <td>${entry.gradeSection}</td> <!-- Display Grade/Section -->
                            <td>${entry.score}</td>
                        </tr>`;
                        leaderboardTable.innerHTML += row;
                    });
                };
            };
        }

        function clearLeaderboard() {
            const dbRequest = indexedDB.open("LeaderboardDB", 1);

            dbRequest.onsuccess = (event) => {
                const db = event.target.result;
                const transaction = db.transaction("scores", "readwrite");
                const objectStore = transaction.objectStore("scores");

                objectStore.clear().onsuccess = () => {
                    alert("Leaderboard cleared successfully!");
                    displayAdminLeaderboard();
                };
            };
        }

        window.onload = function () {
            displayAdminLeaderboard();
        };

        const audio = document.getElementById('background-music');
  audio.volume = 0.5; // Volume range is from 0.0 (silent) to 1.0 (full volume)

    </script>
</body>
</html>
